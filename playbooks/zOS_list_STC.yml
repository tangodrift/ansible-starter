- name: Check STCs
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
  - name: Query a job with a job name of '*'
    ibm.ibm_zos_core.zos_job_query:
       job_name: "*"
    register: result

  - name: Display Host Variables
    ansible.builtin.debug:
      msg:
        - "---Print your variables data here---"
        - "System Info: {{ result }}"
#        - "System Info: {{ result | to_nice_json }}"
